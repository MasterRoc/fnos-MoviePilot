name: Lint

# 打包 workflow（build-and-release.yml）只在打 tag 时跑：单架构十几分钟、
# 产物 250 MB 且自带整个 Python 运行时，不适合每次提交都拉起来。
# 这里补一个秒级的静态检查，让推代码 / 提 PR 能立刻拿到反馈。
#
# 覆盖面刻意收窄在"装完起不来"和"发出错 Release"这两类问题上：
#   - cmd/* 由 NAS 上的 bash 执行，语法错误会让应用装完直接跑不起来，
#     而在 Windows 上开发（本机没有 bash 语义）很容易漏掉；
#   - manifest 的版本与 changelog 会被 Release 直接引用，写错只能事后改。
# 不做风格检查（pylint/flake8）：本仓库没有统一配置，引入只会刷噪音。
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        # build.py 里有 3.14 相关的常量与语法（如 tomllib 回退分支），
        # 用与打包流程一致的 3.14 检查，避免"低版本能编译、3.14 反而不能"。
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Python 语法检查
        # 只编译不执行：这些脚本都是纯标准库，编译期就能挡住语法错误、
        # 误删缩进、少了括号之类低级问题。write 出的 __pycache__ 不入库。
        run: |
          set -e
          python -m compileall -q build.py app/bin tools
          echo "Python 语法检查通过"

      - name: Shell 语法检查
        run: |
          set -e
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! bash -n "$f"; then
              echo "::error file=$f::shell 语法错误"
              fail=1
            fi
          done < <(find cmd -type f | sort)
          if [ "$fail" != "0" ]; then
            exit 1
          fi
          echo "Shell 语法检查通过（${count} 个文件）"

      - name: Node 语法检查
        # 前端静态服务是唯一由 Node 承载的组件，语法错误会让 /api 与静态资源
        # 全部 502，而打包流程不会发现（它只是把文件拷进包里）。
        run: |
          set -e
          node --check app/bin/frontend-server.js
          echo "Node 语法检查通过"

      - name: manifest 版本一致性
        # Release 的标题取 tag、附件名取 manifest version、说明取 manifest
        # changelog，三者一旦脱节，只能删 Release 重发。
        run: |
          set -e
          version=$(grep '^version\s*=' manifest | sed 's/version\s*=\s*//' | tr -d ' ')
          echo "manifest version: ${version}"
          if [ -z "${version}" ]; then
            echo "::error::manifest 里读不到 version"
            exit 1
          fi
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version 必须是 x.y.z 三段式，当前为 '${version}'"
            exit 1
          fi
          if ! grep -q "^changelog.*v${version}<br>" manifest; then
            echo "::error::changelog 缺少 v${version} 段落（Release 说明直接取自这里）"
            exit 1
          fi
          echo "manifest 版本一致：v${version}"
